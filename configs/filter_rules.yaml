# 생성 결과 후처리 규칙 (화장품법 표시·광고 규제 / 의료기기 경계)
# 규제 검토 담당(손승우)이 코드 수정 없이 이 파일만 고치면 되도록 분리함.

# 이 표현이 들어간 문장은 통째로 제거 (의료 행위로 읽힐 수 있음)
drop_sentence_terms:
  - 치료
  - 완치
  - 처방
  - 투약
  - 복용
  - 의약품
  - 질환
  - 질병
  - 아토피
  - 피부염
  - 건선
  - 습진
  - 지루성
  - 한포진
  - 백반증

# 위 단어가 있어도 '전문가에게 가보라'는 안내 문장이면 살린다
keep_sentence_if:
  - 전문의
  - 피부과
  - 상담을 권
  - 상담을 받

# 가짜/검증 불가 출처 제거
remove_patterns:
  - 'PMID\s*:\s*\S+'
  - 'DOI\s*:\s*\S+'
  - '\(\s*\)'

# 효능 단정 표현 완화: [패턴, 치환]. 순서대로 적용
soften:
  - ['(개선|완화|축소|제거|억제|해결|회복)시킵니다', '\1하는 데 도움을 줄 수 있습니다']
  - ['(개선|완화|축소|제거|억제|해결|회복)합니다', '\1하는 데 도움을 줄 수 있습니다']
  - ['(개선|완화|축소|제거|억제|해결|회복)됩니다', '\1되는 데 도움이 될 수 있습니다']
  - ['(개선|완화|축소|제거|억제|해결|회복)할 수 있습니다', '\1하는 데 도움을 줄 수 있습니다']
  - ['(탁월|확실|완벽|즉각적)(한|인) 효과', '도움이 되는 효과']
  - ['효과가 (탁월|확실|완벽)합니다', '도움이 될 수 있습니다']
  - ['(100%|완전히|영구적으로) ', '']

disclaimer: "본 결과는 참고용 정보이며 의학적 진단이나 치료를 대신하지 않습니다. 피부 이상이 지속되면 피부과 전문의와 상담하세요."
